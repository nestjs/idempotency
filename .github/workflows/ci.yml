name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build and pack the sibling packages
        # The resilience composition spec installs @nestjs/resilience from
        # ../resilience/nestjs-resilience-0.0.1.tgz.
        run: |
          git clone --depth 1 https://github.com/nestjs/resilience.git ../resilience
          (cd ../resilience && npm install && npm run build && npm pack)
      - run: npm install
      - run: npm run build
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node.js line vitest 5 runs on and the current one, against
        # both supported NestJS majors.
        node-version: [22, 24]
        nestjs-version: ['11', '12']
        include:
          # @nestjs/graphql and @nestjs/apollo follow their own majors: 13
          # supports NestJS 11, 14 supports NestJS 12.
          - nestjs-version: '11'
            nestjs-graphql-version: '13'
          - nestjs-version: '12'
            nestjs-graphql-version: '14'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build and pack the sibling packages
        # The resilience composition spec installs @nestjs/resilience from
        # ../resilience/nestjs-resilience-0.0.1.tgz.
        run: |
          git clone --depth 1 https://github.com/nestjs/resilience.git ../resilience
          (cd ../resilience && npm install && npm run build && npm pack)
      - name: Install dependencies
        run: npm install
      - name: Install NestJS ${{ matrix.nestjs-version }}
        # The strict install above already checked the tree. @nestjs/graphql 14.0.2 declares an
        # optional typescript peer of ^5.5 || ^6 (its CLI plugin), which rejects this repo's TypeScript 7.
        run: npm install --no-save --legacy-peer-deps @nestjs/common@${{ matrix.nestjs-version }} @nestjs/core@${{ matrix.nestjs-version }} @nestjs/testing@${{ matrix.nestjs-version }} @nestjs/platform-express@${{ matrix.nestjs-version }} @nestjs/platform-fastify@${{ matrix.nestjs-version }} @nestjs/microservices@${{ matrix.nestjs-version }} @nestjs/graphql@${{ matrix.nestjs-graphql-version }} @nestjs/apollo@${{ matrix.nestjs-graphql-version }}
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e
